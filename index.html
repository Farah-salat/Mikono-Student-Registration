<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mikono VTC Student Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Mikono Vocational Training Centre</h1>
        <p>Student Registration System</p>
        <a href="dashboard.html"
            style="background-color: #9b59b6; color: white; padding: 12px 24px; text-decoration: none; border-radius: 5px; display: inline-block; margin-top: 10px;">
            📊 View Dashboard
        </a>
    </header>

    <main>

        <section>
            <h2>Register a New Student</h2>

            <form id="studentForm">

                <!-- Student Name -->
                <div>
                    <label for="firstName">First Name:</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>

                <div>
                    <label for="lastName">Last Name:</label>
                    <input type="text" id="lastName" name="lastName" required>
                </div>

                <!-- Contact Information -->
                <div>
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>

                <div>
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email">
                </div>

                <!-- Course -->
                <div>
                    <label for="course">Select Course:</label>

                    <select id="course" name="course" required>
                        <option value="">-- Select a Course --</option>
                        <option value="Tailoring & Dressmaking">Tailoring & Dressmaking</option>
                        <option value="ICT Basic Computer Packages">ICT Basic Computer Packages</option>
                        <option value="Beauty Therapy & Salon">Beauty Therapy & Salon</option>
                        <option value="Welding & Fabrication">Welding & Fabrication</option>
                        <option value="Light Motor Vehicle Mechanics">Light Motor Vehicle Mechanics</option>
                        <option value="Electrical Wiring">Electrical Wiring</option>
                        <option value="Web Development & Design">Web Development & Design</option>
                        <option value="Database Systems & Management">Database Systems & Management</option>
                        <option value="Software Engineering essentials">Software Engineering essentials</option>
                    </select>
                </div>

                <!-- Enrollment Date -->
                <div>
                    <label for="enrollmentDate">Enrollment Date:</label>
                    <input type="date" id="enrollmentDate" name="enrollmentDate" required>
                </div>

                <!-- Buttons -->
                <div>
                    <button type="submit">Register Student</button>
                    <button type="reset">Clear Form</button>
                    <button type="button" id="cancelEditBtn"
                        style="display: none; background-color: #6c757d; color: white; padding: 10px 16px; border: none; border-radius: 5px; cursor: pointer; font-size: 15px;">
                        Cancel Edit
                    </button>
                </div>

            </form>
        </section>

        <section>
            <h2>Registered Students</h2>

            <button type="button" id="exportBtn"
                style="background-color: #28a745; color: white; padding: 10px 16px; border: none; border-radius: 5px; cursor: pointer; font-size: 15px; margin-bottom: 15px;">
                📥 Export to CSV
            </button>

            <!-- Student count display -->
            <div
                style="margin-bottom: 15px; padding: 10px; background-color: #f8f9fa; border-radius: 5px; border-left: 4px solid #007bff;">
                <strong>📊 Total Students:</strong> <span id="totalStudents">0</span>
                <span style="margin-left: 20px;">|</span>
                <strong>Showing:</strong> <span id="showingStudents">0</span>
            </div>

            <!-- Search input -->
            <div style="margin-bottom: 15px;">
                <input type="text" id="searchInput" placeholder="🔍 Search by name, course, or phone..."
                    style="width: 100%; padding: 10px; font-size: 15px; border: 2px solid #ddd; border-radius: 5px;">
            </div>

            <!-- Course filter dropdown -->
            <div style="margin-bottom: 15px;">
                <label for="courseFilter" style="font-weight: bold; margin-right: 10px;">Filter by Course:</label>
                <select id="courseFilter"
                    style="padding: 10px; font-size: 15px; border: 2px solid #ddd; border-radius: 5px; min-width: 250px;">
                    <option value="">All Courses</option>
                    <option value="Tailoring & Dressmaking">Tailoring & Dressmaking</option>
                    <option value="ICT Basic Computer Packages">ICT Basic Computer Packages</option>
                    <option value="Beauty Therapy & Salon">Beauty Therapy & Salon</option>
                    <option value="Welding & Fabrication">Welding & Fabrication</option>
                    <option value="Light Motor Vehicle Mechanics">Light Motor Vehicle Mechanics</option>
                    <option value="Electrical Wiring">Electrical Wiring</option>
                    <option value="Web Development & Design">Web Development & Design</option>
                    <option value="Database Systems & Management">Database Systems & Management</option>
                </select>
            </div>

            <table id="studentsTable">
                <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>Phone</th>
                        <th>Course</th>
                        <th>Enrollment Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <p id="noStudentsMsg">No students registered yet.</p>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Mikono Vocational Training Centre</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
